name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Restore green school logo
        run: |
          mkdir -p app/src/main/res/drawable
          base64 --decode branding/school-logo.base64 > app/src/main/res/drawable/school_logo.png
          base64 --decode branding/school-playground.base64 > app/src/main/res/drawable/school_playground.jpg

      - name: Create isolated release signing key
        id: signing
        shell: bash
        run: |
          KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
          KEY_PASSWORD="$(openssl rand -hex 24)"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/elenga-school-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias elenga_school \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -dname "CN=Elenga Multimedia School, OU=Mobile App, O=Dotorbits, L=Elenga, ST=Tangail, C=BD"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/elenga-school-release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=elenga_school"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: gradle assembleRelease

      - name: Prepare release APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/Elenga-Multimedia-School.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elenga-Multimedia-School-APK
          path: release/Elenga-Multimedia-School.apk
          if-no-files-found: error
          retention-days: 30
